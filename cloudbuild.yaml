steps:
  - name: 'node'
    entrypoint: 'npm'
    args: ['ci']

  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/graffiticode/l0001:$COMMIT_SHA', '.']

  - name: gcr.io/cloud-builders/docker
    args: ['push', 'gcr.io/graffiticode/l0001:$COMMIT_SHA']
    id: Push

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim'
    entrypoint: gcloud
    args:
      - run
      - deploy
      - l0001
      - '--platform=managed'
      - '--image=gcr.io/graffiticode/l0001:$COMMIT_SHA'
      - '--labels=commit-sha=$COMMIT_SHA,gcb-build-id=$BUILD_ID'
      - '--region=$_DEPLOY_REGION'
      - '--quiet'
      - '--allow-unauthenticated'
      # ISOLATE-01: this compiler reaches the outside only through the egress proxy
      # (graffiticode/graffiticode deploy/egress-proxy; checked by scripts/legacy-network-check.js).
      # --update-env-vars, not --set-env-vars: the proxy variables must survive every deploy.
      - '--network=compilers'
      - '--subnet=compilers-default'
      - '--network-tags=compiler'
      - '--vpc-egress=all-traffic'
      - '--update-secrets=/etc/egress-ca/ca.pem=egress-proxy-ca-bundle:1'
      - '--update-env-vars=^@^HTTPS_PROXY=http://10.8.0.2:3128@HTTP_PROXY=http://10.8.0.2:3128@NO_PROXY=169.254.169.254,metadata.google.internal@NODE_EXTRA_CA_CERTS=/etc/egress-ca/ca.pem@NODE_USE_ENV_PROXY=1'
    id: Deploy

images:
  - 'gcr.io/graffiticode/l0001:$COMMIT_SHA'

options:
  substitutionOption: ALLOW_LOOSE

substitutions:
  _DEPLOY_REGION: us-central1

tags:
  - l0001
