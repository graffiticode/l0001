steps:
  - name: 'node'
    entrypoint: 'npm'
    args: ['ci']

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/l0001-staging:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/l0001-staging:$BRANCH_NAME'
      - '.'

  - name: gcr.io/cloud-builders/docker
    args: ['push', '--all-tags', 'gcr.io/$PROJECT_ID/l0001-staging']
    id: Push

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim'
    entrypoint: gcloud
    args:
      - run
      - deploy
      - 'l0001-$BRANCH_NAME'
      - '--platform=managed'
      - '--image=gcr.io/$PROJECT_ID/l0001-staging:$COMMIT_SHA'
      - '--labels=commit-sha=$COMMIT_SHA,branch=$BRANCH_NAME'
      - '--region=$_DEPLOY_REGION'
      - '--quiet'
      - '--port=3000'
      # ISOLATE-01: staging services are compilers too: they run as l0001-run and reach
      # the outside only through the egress proxy, like production (checked by
      # graffiticode/graffiticode scripts/legacy-network-check.js).
      - '--service-account=l0001-run@graffiticode.iam.gserviceaccount.com'
      - '--network=compilers'
      - '--subnet=compilers-default'
      - '--network-tags=compiler'
      - '--vpc-egress=all-traffic'
      - '--update-secrets=/etc/egress-ca/ca.pem=egress-proxy-ca-bundle:1'
      - '--update-env-vars=^@^NODE_ENV=staging@BRANCH=$BRANCH_NAME@HTTPS_PROXY=http://10.8.0.2:3128@HTTP_PROXY=http://10.8.0.2:3128@NO_PROXY=169.254.169.254,metadata.google.internal@NODE_EXTRA_CA_CERTS=/etc/egress-ca/ca.pem@NODE_USE_ENV_PROXY=1'
      - '--allow-unauthenticated'
      - '--max-instances=10'
      - '--memory=256Mi'
    id: Deploy

images:
  - 'gcr.io/$PROJECT_ID/l0001-staging:$COMMIT_SHA'

options:
  substitutionOption: ALLOW_LOOSE
  logging: CLOUD_LOGGING_ONLY

substitutions:
  _DEPLOY_REGION: us-central1

tags:
  - l0001
  - staging
